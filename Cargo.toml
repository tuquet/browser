[package]
name = "tuquet-browser"
version = "0.1.0"
edition = "2024"
description = "Dedicated Browser Runtime, Multi-Profile Sandbox & Automation Subsystem for Tuquet"
repository = "https://github.com/tuquet/browser"
readme = "README.md"
license = "MIT"

[features]
default = []
utoipa = ["dep:utoipa"]

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
zip = "0.6.6"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0"
tracing = "0.1.44"
sysinfo = "0.39.6"
utoipa = { version = "5.5.0", optional = true }
command-group = { version = "5.0", features = ["with-tokio"] }
sha2 = "0.10"
hex = "0.4"
ignore = "0.4.33"
tar = "0.4.46"
zstd = "0.14.0"
lzma-rs = "0.3.0"
libc = "0.2.190"
